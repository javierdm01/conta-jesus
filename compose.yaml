name: instala-jesus
x-application: &application
  image: instala-jesus:local
  build: .
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: instala
      POSTGRES_USER: instala
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instala -d instala"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *application
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://instala:${POSTGRES_PASSWORD}@db:5432/instala
    depends_on:
      db: {condition: service_healthy}
  web:
    <<: *application
    ports: ["${PORT_BIND:-127.0.0.1}:3000:3000"]
    environment: &app-env
      DATABASE_URL: postgresql://instala:${POSTGRES_PASSWORD}@db:5432/instala
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Configura BETTER_AUTH_SECRET en .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      APP_TRUSTED_ORIGINS: ${APP_TRUSTED_ORIGINS:-}
      DOCUMENT_DIR: /app/data/documents
      REDIS_URL: redis://redis:6379
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
      VOICE_URL: http://whisper:9000
      TTS_URL: http://tts:9100
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VOICE_MODEL: ${OPENAI_VOICE_MODEL:-gpt-4o-mini}
    volumes: ["documents:/app/data/documents", "./backups:/app/backups:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    <<: *application
    command: ["npm", "run", "worker"]
    environment: *app-env
    volumes: ["documents:/app/data/documents"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    mem_limit: 3000m
    cpus: 2.0
  sonepar:
    <<: *application
    command: ["node", "--import", "tsx", "scripts/sonepar-automation.ts"]
    environment:
      DATABASE_URL: postgresql://instala:${POSTGRES_PASSWORD}@db:5432/instala
      SONEPAR_COMPANY_ID: ${SONEPAR_COMPANY_ID:-}
      SONEPAR_EXCHANGE_DIR: /app/data/sonepar
    volumes: ["./data/automation/sonepar:/app/data/sonepar"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
  whisper:
    build: ./voice
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    volumes: ["whisper-models:/models"]
    mem_limit: 1500m
    restart: unless-stopped
  tts:
    build: ./voice/tts
    mem_limit: 1500m
    restart: unless-stopped
  backup:
    image: postgres:16-bookworm
    environment:
      PGHOST: db
      PGUSER: instala
      PGDATABASE: instala
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-0}
    volumes: ["documents:/documents:ro", "./backups:/backups", "./scripts/backup.sh:/backup.sh:ro"]
    entrypoint: ["bash", "/backup.sh"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  documents:
  redis:
  whisper-models:
