<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Instala · Sin conexión</title>
<style>body{font:18px system-ui;max-width:440px;margin:20vh auto;padding:24px;color:#183d3b}a{color:#115e59}button{font:inherit;padding:10px 16px;cursor:pointer}</style>
<h1>Sin conexión al servidor</h1>
<p>Comprueba que estás conectado a la red de tu empresa. Si la sesión ha caducado, podrás iniciar sesión cuando vuelva la conexión.</p>
<p>Los cambios solo se guardan cuando el servidor confirma la operación.</p>
<button id="retry" type="button">Volver a intentar</button>
<p><a href="/login">Ir a iniciar sesión</a></p>
<p id="status" role="status"></p>
<script>
  async function reconnect() {
    const status = document.getElementById('status');
    status.textContent = 'Comprobando la conexión…';
    try {
      const response = await fetch('/api/auth/get-session', {cache:'no-store', credentials:'same-origin'});
      if (response.status === 401) { location.replace('/login'); return; }
      if (!response.ok) throw new Error('Servidor no disponible');
      const session = await response.json();
      location.replace(session && session.user ? '/' : '/login');
    } catch {
      status.textContent = 'No se puede conectar todavía. Comprueba el Wi‑Fi y vuelve a intentarlo.';
    }
  }
  document.getElementById('retry').addEventListener('click', reconnect);
  window.addEventListener('online', reconnect);
  reconnect();
</script>
</html>
