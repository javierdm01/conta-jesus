# Refuerzo para el servidor. Se activa con COMPOSE_FILE=compose.yaml:compose.production.yaml en .env
# (scripts/deploy.sh lo configura), de modo que `docker compose ...` funciona igual que en local.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}
services:
  db:
    logging: *logging
  migrate:
    logging: *logging
  web:
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
  worker:
    logging: *logging
  backup:
    logging: *logging
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Configura SITE_ADDRESS en .env}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging
volumes:
  caddy-data:
  caddy-config:
